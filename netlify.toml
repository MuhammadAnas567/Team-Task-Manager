[build]
  command = "npm ci && npm run build --workspace backend && npm run build --workspace frontend"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NETLIFY = "true"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["bcrypt"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
